name: Docker image

# Publishes ghcr.io/i-press-buttons/pathwatch (linux/amd64 + linux/arm64).
#
#   push to default branch  -> latest, sha-<short>
#   push to any other branch -> edge,   sha-<short>
#   push of tag vX.Y.Z      -> X.Y.Z, X.Y, sha-<short>

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute version string
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is only needed to run the arm64 *runtime* stage (apk add); the Go
      # compile itself is a native cross-compile.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # "latest" is handled explicitly below (default branch only).
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=pathwatch
            org.opencontainers.image.description=Self-hosted PingPlotter-style network path monitor
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          # Keeps the GHCR package page free of "unknown/unknown" attestation entries.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
