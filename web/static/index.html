<!doctype html>
<html lang="en" data-theme="light" data-theme-pref="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pathwatch</title>
<meta name="description" content="Self-hosted network path monitor">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
/* Apply the saved theme before first paint to avoid a flash. Keep in sync with js/theme.js */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('pathwatch.theme') || 'auto'; } catch (e) {}
  var known = ['auto','light','dark','midnight','nord','solarized-light','solarized-dark','high-contrast','classic'];
  if (known.indexOf(pref) < 0) pref = 'auto';
  var t = pref;
  if (pref === 'auto') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  var d = document.documentElement;
  d.setAttribute('data-theme', t);
  d.setAttribute('data-theme-pref', pref);
})();
</script>
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/uPlot.iife.min.js"></script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="pathwatch home">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 17l4-6 4 3 5-8 5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="11" r="1.6" fill="currentColor"/><circle cx="11" cy="14" r="1.6" fill="currentColor"/><circle cx="16" cy="6" r="1.6" fill="currentColor"/></svg>
    <span>pathwatch</span>
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/alerts" data-nav="alerts">Alerts</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="topbar-spacer"></div>
  <div class="chips" id="chips"></div>
  <label class="theme-select" title="Theme">
    <span class="swatches" id="theme-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="sr-only">Theme</span>
    <select id="theme-select" aria-label="Theme"></select>
  </label>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<main id="view" class="view" tabindex="-1">
  <div class="loading-block">Loading…</div>
</main>
<noscript><p style="padding:16px">pathwatch needs JavaScript enabled.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
