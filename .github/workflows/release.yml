name: Release binaries

# Builds Linux (amd64, arm64, armv7) and Windows (amd64) binaries with
# GoReleaser and attaches them to the GitHub release for the tag.
# Docker images are published by docker.yml, not here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      # Do not release with a known, reachable standard-library vulnerability.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.x'
          check-latest: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
